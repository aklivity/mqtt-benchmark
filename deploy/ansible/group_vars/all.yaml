# Broker under test: zilla or emqx (override with `ansible-playbook deploy.yaml -e broker=emqx`)
broker: zilla

# Versions under test. Pin a release tag or an image digest for any result you publish.
# EMQX 6.x ships a free single-node Community License (10M sessions) that includes the Kafka integration.
emqx_image: emqx/emqx:6.3.3@sha256:54778dba62a5cbcb03ca381c9bceb3d8a87cab9e3da155ed3607d994454df900
zilla_image: ghcr.io/aklivity/zilla:2.8.0-rc8@sha256:93e97f6987c5a30b91f28398ae52e079183ab4db3b6ae9c34997d78c76e0bf4a
kafka_image: apache/kafka:4.1.1
bench_image: emqx/emqtt-bench:0.6.3
mosquitto_image: eclipse-mosquitto:2.0
kafkacat_image: confluentinc/cp-kafkacat:7.1.9
node_exporter_image: prom/node-exporter:v1.8.2
prometheus_image: prom/prometheus:v2.54.1
grafana_image: grafana/grafana:11.2.0

mqtt_port: { zilla: 7183, emqx: 1883 }
# true after bin/aws/zilla-image.sh loaded zilla_image onto the broker host: skips the docker pull
zilla_image_loaded: false
# JVM options for Zilla (JAVA_OPTIONS), e.g. -Xmx or -XX flags; empty adds nothing. A JVM -D system property does NOT
# reach Zilla's configuration: use zilla_start_args for Zilla properties.
zilla_java_options: ""
# Extra arguments for `zilla start`, e.g. -e zilla_start_args=-Pzilla.binding.mqtt.session.state.store.enabled=true
# (Zilla reads its properties from -P options and zilla.properties, not from JVM system properties); empty adds nothing
zilla_start_args: ""
# true adds the cache_server `bootstrap` block (mqtt-messages, mqtt-retained, mqtt-devices): the Zilla cache then keeps
# fetching every partition of those topics into the cache whether or not anything reads them, which is extra cache work in
# publish-only runs. false (the default) fetches a partition only while a stream reads it
zilla_cache_bootstrap: false
# true: GC log and a continuous Flight Recorder recording of Zilla under /var/log/zilla on the broker host
# (bin/run-scenario.sh with DIAG=1 collects them)
# GiB of RAM for a tmpfs that holds Zilla's engine directory (stream rings, buffers, events and metrics; the cache stays on
# the root volume at /var/run/zilla/cache). Zilla sizes its memory as the smaller of 25% of RAM and 75% of the engine
# directory's free space, so keep this at 21 GiB or more on a 61 GiB host or the sizing changes; a tmpfs only uses what is touched.
zilla_engine_tmpfs_gib: 0
zilla_diagnostics: false
# false: with zilla_diagnostics, record only the GC log. For images whose runtime has no jdk.jfr module
zilla_jfr: true
# "no" keeps a crashed broker down so the run shows it; set "unless-stopped" for soak tests
broker_restart: "no"

kafka_heap: "-Xms8g -Xmx8g"
mqtt_devices_partitions: 16
mqtt_messages_partitions: 16
mqtt_sessions_partitions: 1
mqtt_retained_partitions: 1
# mqtt-devices keeps 15 minutes: at 100K msg/s that bounds Kafka's and Zilla's cached copy to about 90 GB each
kafka_topics:
  - { name: mqtt-devices,  partitions: "{{ mqtt_devices_partitions }}",  config: ["cleanup.policy=delete", "retention.ms=900000"] }
  - { name: mqtt-messages, partitions: "{{ mqtt_messages_partitions }}", config: ["cleanup.policy=delete"] }
  - { name: mqtt-retained, partitions: "{{ mqtt_retained_partitions }}", config: ["cleanup.policy=compact"] }
  - { name: mqtt-sessions, partitions: "{{ mqtt_sessions_partitions }}", config: ["cleanup.policy=compact"] }
kafka_replication: 1
